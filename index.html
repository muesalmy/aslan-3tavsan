<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Nazlı Tavşan Enes Aslandan Kaçıyor</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: 
        linear-gradient(rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.6)),
        url('th.jpeg') repeat;
      background-size: 300px;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: transparent;
    }

    #gameOverMessage {
      position: absolute;
      top: 30%;
      width: 100%;
      text-align: center;
      font-size: 40px;
      font-family: sans-serif;
      color: red;
      font-weight: bold;
      display: none;
    }

    #timer {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 24px;
      font-family: sans-serif;
      color: black;
      background-color: rgba(255,255,255,0.7);
      padding: 5px 10px;
      border-radius: 5px;
    }

    #restartButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
      padding: 10px 20px;
      display: none;
      cursor: pointer;
      background-color: #fff;
      border: 2px solid #000;
      border-radius: 5px;
    }
  </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="gameOverMessage">💔 Eyvah! Aslan tavşanı yemiş!</div>
<div id="timer">⏱ 0 saniye</div>
<button id="restartButton">🔁 Yeniden Başla</button>

<!-- Yeni öpücük sesi -->
<audio id="kissSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_b7dc93a5f4.mp3?filename=smooch-1-46162.mp3"></audio>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const kissSound = document.getElementById("kissSound");
const gameOverMessage = document.getElementById("gameOverMessage");
const timerDisplay = document.getElementById("timer");
const restartButton = document.getElementById("restartButton");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let nazli, enes, hearts, isGameOver, startTime, timerInterval;

function initializeGame() {
  nazli = { x: 100, y: 100, size: 80, speed: 5 };
  enes = { x: 400, y: 300, size: 100, speed: 2.5 };
  hearts = [];
  isGameOver = false;
  gameOverMessage.style.display = "none";
  restartButton.style.display = "none";
  startTime = Date.now();
  timerDisplay.textContent = "⏱ 0 saniye";
  clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
  requestAnimationFrame(gameLoop);
}

function updateTimer() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  timerDisplay.textContent = `⏱ ${elapsed} saniye`;
}

function drawEmoji(x, y, emoji, name) {
  ctx.beginPath();
  ctx.arc(x + 20, y - 20, 30, 0, 2 * Math.PI);
  ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
  ctx.fill();
  ctx.font = "60px Arial";
  ctx.fillText(emoji, x, y);
  ctx.font = "20px Arial";
  ctx.fillStyle = "black";
  ctx.textAlign = "center";
  ctx.fillText(name, x + 20, y - 30);
}

function moveNazli(keys) {
  if (keys["ArrowUp"] && nazli.y > 0) nazli.y -= nazli.speed;
  if (keys["ArrowDown"] && nazli.y < canvas.height - nazli.size) nazli.y += nazli.speed;
  if (keys["ArrowLeft"] && nazli.x > 0) nazli.x -= nazli.speed;
  if (keys["ArrowRight"] && nazli.x < canvas.width - nazli.size) nazli.x += nazli.speed;
}

function moveEnes() {
  let dx = nazli.x - enes.x;
  let dy = nazli.y - enes.y;
  let distance = Math.sqrt(dx*dx + dy*dy);
  enes.x += (dx / distance) * enes.speed;
  enes.y += (dy / distance) * enes.speed;

  enes.x = Math.max(0, Math.min(enes.x, canvas.width - enes.size));
  enes.y = Math.max(0, Math.min(enes.y, canvas.height - enes.size));
}

function checkCollision() {
  let dx = nazli.x - enes.x;
  let dy = nazli.y - enes.y;
  let distance = Math.sqrt(dx*dx + dy*dy);
  return distance < 50;
}

function addHeart() {
  hearts.push({ x: enes.x, y: enes.y, life: 60 });
}

function drawHearts() {
  for (let i = hearts.length - 1; i >= 0; i--) {
    const h = hearts[i];
    ctx.fillText("❤️", h.x, h.y - (60 - h.life));
    h.life--;
    if (h.life <= 0) {
      hearts.splice(i, 1);
    }
  }
}

let keys = {};
window.addEventListener("keydown", e => keys[e.key] = true);
window.addEventListener("keyup", e => keys[e.key] = false);

restartButton.addEventListener("click", () => {
  initializeGame();
});

function gameLoop() {
  if (isGameOver) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  moveNazli(keys);
  moveEnes();

  if (checkCollision()) {
    isGameOver = true;
    addHeart();
    kissSound.play();
    gameOverMessage.style.display = "block";
    restartButton.style.display = "block";
    clearInterval(timerInterval);
    return;
  }

  drawEmoji(nazli.x, nazli.y, "🐰", "Nazlı");
  drawEmoji(enes.x, enes.y, "🦁", "Enes");
  drawHearts();
  requestAnimationFrame(gameLoop);
}

initializeGame();
</script>
</body>
</html>
